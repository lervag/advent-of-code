[package]
name = "aoc-2026"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Advent of Code 2026 - year of Rust"
default-run = "aoc"
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
fxhash = "0.2.1"
itertools = "0.15.0"
rayon = "1.12.0"
regex = "1.13.2"

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# Slower to build, faster to run. Used by `mise run bench`.
[profile.bench-release]
inherits = "release"
lto = true
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that mostly add noise in puzzle code
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unnecessary_wraps = "allow"  # every part returns Result, also when it cannot fail

# Selected "restriction" lints
allow_attributes = "warn"  # use #[expect(...)] instead of #[allow(...)]
allow_attributes_without_reason = "warn"  # every exception must say why
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unsafe_code = "forbid"
